<!DOCTYPE html>
<html>
<head>

    body {
      margin: 0;
      font-family: Arial;
      background: #f4f4f4;
    }

    .header {
      background: #111;
      color: white;
      padding: 20px;

      font-size: 28px;
    }

    .hero {

      display: inline-block;
      margin-top: 10px;
    }

</head>

<body>

  <div class="header">
    Smart Bazar
  </div>

  <div class="hero">
    <h1>Welcome to Smart Bazar</h1>

</html>
